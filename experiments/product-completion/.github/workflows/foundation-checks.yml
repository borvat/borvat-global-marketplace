name: BORVAT Foundation Checks

on:
  pull_request:
  push:
    branches:
      - feature/mercur-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run dependency-free prototype and structure tests
        run: |
          node --test tests/*.test.mjs
          node --test scripts/check-foundation.mjs
      - name: Confirm no live deployment occurs
        run: echo "This workflow performs tests only; no install, deploy, or payments."
