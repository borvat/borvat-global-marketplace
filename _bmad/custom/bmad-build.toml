[workflow]
persistent_facts = ["file:{project-root}/docs/engineering-memory/POLICY.md"]
activation_steps_append = ["For this BMAD task, run `python3 tools/project_memory.py resume`, then `python3 tools/agent_learning.py audit`, then `python3 tools/agent_learning.py brief --tag engineering`. Read the full outputs before planning or edits. Current Git/source and existing instructions outrank memory; stale state/test identities are historical. Preserve unfinished work. Read docs/engineering-memory/LEARNING.md when adding/reviewing a lesson. Candidates are inactive. On failure record MEMORY_UNAVAILABLE or LEARNING_UNAVAILABLE; never claim retrieval succeeded or erase journals."]
on_complete = "After determining the real task acceptance and final status, archive a material engineering result using `python3 tools/project_memory.py archive --event <external-event-json-path>`. Follow docs/engineering-memory/README.md for the strict event schema. Use actual values and existing contained evidence; keep the input JSON outside the checkout. Capture `python3 tools/project_memory.py snapshot` at the tested source before the test, retain that identity in its evidence, and capture the final source again before archive. Label earlier tests historical when identities differ; never invent a PASS or deployment observation. Use a stable unique event ID so an interrupted or repeated completion can replay without duplicate history. Archive status is engineering complete/partial/blocked, never application delivery or a new approval. Run `python3 tools/project_memory.py resume` afterward and read the result. Preserve prior history and existing state prose; do not replace the approved lesson ledger. If archive/recovery fails, report MEMORY_UNAVAILABLE and the concrete limitation; do not erase unfinished work or claim durable completion. A nonmaterial task needs no new event.\n\nAfter the real task acceptance and final status have been determined, inspect its test and review evidence for ONE concrete, generalizable lesson that is not already in the ledger. Only if such evidence exists, run `python3 tools/agent_learning.py add-candidate --id <unique-id> --title \"<brief-title>\" --trigger \"<observed-condition>\" --guidance \"<preventive-action>\" --tag engineering --evidence <existing-repo-relative-evidence-path>`. Supply actual values, not angle-bracket placeholders; add `--tag engineering` when the lesson also concerns invoicing. Keep this project engineering ledger separate from operational application memory. This is a CANDIDATE only: never auto-promote, auto-retire, edit vendor skills, rerun an LLM for improvement, change production, or classify the task as delivered based on this log. If there is no evidenced new lesson, add nothing. A failed candidate write is a noted learning limitation, not a reason to misstate task completion.\n\nAfter a successful candidate append, run `python3 tools/agent_learning.py audit` and inspect `git status --short` plus the scoped diff of `docs/engineering-memory/lessons.jsonl` and any new evidence files from this task. Original step-05-present and oneshot commit before On Complete, so the earlier task commit does not contain this append. If audit succeeds, confirm the current branch is the task's already-authorized non-main development branch and make a small follow-up local commit containing only this candidate append and its task evidence. Inspect the exact changes before committing; use explicit paths, preserve all existing records, and leave unrelated dirty or staged files untouched. Never use blanket staging or include unrelated changes sharing a scoped file; if isolation is unavailable, leave them uncommitted and report the limitation. Do not switch branches, amend the earlier task commit or infer publication authority from this hook. Publish the follow-up only under the task's existing publication authorization, to its already-authorized development head; this instruction grants no automatic push. Report the follow-up commit identity separately from the task commit and verify remote readback only if publication was authorized and executed. If audit, scoped commit or authorized publication is unavailable or fails, explicitly report `LOCAL_ONLY / shared persistence pending` with the reason; never claim a candidate is available to the next host checkout without remote evidence. These are project instructions, not an automatic Git hook or a guarantee that the host performed them.\n\nThe same post-completion persistence ordering applies when archive succeeded with no new lesson: inspect the scoped changes to docs/commerce-integration/EXECUTION-STATE.md, docs/engineering-memory/HISTORY.md and the event's new evidence; run resume and the learning audit, then preserve only those task-owned changes in a scoped follow-up local commit on the already-authorized non-main task branch. When both archive and candidate changed, use one isolated follow-up containing both and their actual evidence. A new candidate/evidence append may make the earlier state STALE; report that truthfully or archive a distinct final checkpoint with the final source and historical tests. Never edit an existing event or reuse its ID with different content to hide staleness. Current content with a changed bookkeeping HEAD keeps the recorded test HEAD historical. Publish and read back only under existing task authority; otherwise report LOCAL_ONLY / shared persistence pending. Original completion and review/commit steps remain authoritative.\n"
